name: CI

on:
  pull_request:
  push:
    branches: [master]
    # 只在代码变动时跑；每日数据提交（data/ 下的 db、FIT、JSON）不触发
    paths:
      - 'src/**'
      - 'public/**'
      - 'sync/*.py'
      - 'requirements*.txt'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Smoke test - GPX 解析链路
        run: python sync/gpx.py

      - name: Unit checks
        run: |
          for t in sync/test_*.py; do python "$t"; done

      - name: Check formatting (black)
        run: black . --diff --color && black . --check

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check .

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Check, lint and build
        run: |
          pnpm run check
          pnpm run lint
          pnpm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
