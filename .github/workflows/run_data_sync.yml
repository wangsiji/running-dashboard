name: Run Data Sync

on:
  schedule:
    - cron: '0 3 * * *' # 北京时间每天 11:00
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'sync/**'
      - 'requirements.txt'
      - '.github/workflows/run_data_sync.yml'

permissions:
  contents: write

env:
  ATHLETE: wangsiji
  TITLE: 思己 · Running
  # 轨迹裁剪（隐私）：起终点各裁 10 米，范围内的点也忽略
  IGNORE_START_END_RANGE: 10
  IGNORE_RANGE: 10
  IGNORE_POLYLINE: 'ktjrFoemeU~IorGq}DeB'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync Coros script
        run: python sync/coros.py ${{ secrets.COROS_ACCOUNT }} ${{ secrets.COROS_PASSWORD }}

      - name: Push new runs
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add .
          git commit -m 'update new runs' || echo 'nothing to commit'
          git pull --rebase --autostash origin master
          git push

  publish_github_pages:
    if: needs.sync.result == 'success'
    name: Build and publish Github Pages
    uses: ./.github/workflows/gh-pages.yml
    needs:
      - sync
